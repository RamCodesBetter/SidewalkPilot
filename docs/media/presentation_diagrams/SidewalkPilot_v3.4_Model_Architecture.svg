    <text x="207.5" y="740" fill="#42307D">probabilities = softmax(9 logits)</text>
    <rect x="440" y="690" width="300" height="90" rx="7" fill="#EEF4FF" stroke="#3538CD" stroke-width="1.5"/>
    <text x="590" y="740" fill="#2D31A6">class = argmax(probabilities)</text>
    <rect x="810" y="690" width="315" height="90" rx="7" fill="#ECFDF3" stroke="#16834A" stroke-width="1.5"/>
    <text x="967.5" y="740" fill="#14532D">fraction = sigmoid(offset[class])</text>
    <rect x="1195" y="690" width="360" height="90" rx="7" fill="#FFF4ED" stroke="#E04F16" stroke-width="1.5"/>
    <text x="1375" y="730" fill="#7A2E0E">steering = class_low + fraction x</text>
    <text x="1375" y="752" fill="#7A2E0E">(class_high - class_low)</text>
  </g>
