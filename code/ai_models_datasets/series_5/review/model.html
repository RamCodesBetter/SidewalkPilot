<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SidewalkPilot | 5.A test masks</title><link rel="stylesheet" href="comparison.css"><link rel="stylesheet" href="model.css"></head>
<body class="loading">
<header><div><h1>SidewalkPilot <span>/ 5.A mask review</span></h1><p id="scope"></p></div>
<div class="actions"><span id="progress">0 reviewed</span>
<button class="icon" id="import" aria-label="Import review" title="Import review"><i data-lucide="upload"></i></button>
<button class="icon primary" id="export" aria-label="Export review" title="Export review"><i data-lucide="download"></i></button>
<button class="icon" id="clear" aria-label="Clear this review" title="Clear this review"><i data-lucide="trash-2"></i></button></div></header>
<input type="file" id="import-file" accept="application/json" hidden>
<main>
<div class="toolbar">
<div class="actions"><button class="icon" id="previous" aria-label="Previous image" title="Previous image (Left arrow)"><i data-lucide="chevron-left"></i></button>
<input id="position" type="number" min="1" value="1" aria-label="Image number"><span id="total"></span>
<button class="icon" id="next" aria-label="Next image" title="Next image (Enter)"><i data-lucide="chevron-right"></i></button></div>
<fieldset class="segments modes"><legend class="sr-only">Prediction view</legend>
<label><input type="radio" name="mode" value="overlay" checked>Overlay</label>
<label><input type="radio" name="mode" value="mask">Mask</label>
<label><input type="radio" name="mode" value="source">Original</label></fieldset>
<label class="slider">Opacity <input type="range" id="opacity" min="0" max="100" value="40"><output id="opacity-value">40%</output></label>
<div class="actions"><button class="icon" id="zoom-out" aria-label="Zoom out" title="Zoom out"><i data-lucide="zoom-out"></i></button>
<output id="zoom-value">100%</output><button class="icon" id="zoom-in" aria-label="Zoom in" title="Zoom in"><i data-lucide="zoom-in"></i></button>
<button class="icon" id="fit" aria-label="Fit image" title="Fit image"><i data-lucide="maximize"></i></button></div>
<label class="toggle"><input id="reference" type="checkbox">Reference</label>
<fieldset class="segments"><legend class="sr-only">Layout</legend>
<button class="icon" data-layout="columns" aria-label="Side by side" title="Side by side" aria-pressed="true"><i data-lucide="columns-2"></i></button>
<button class="icon" data-layout="stack" aria-label="Stacked" title="Stacked" aria-pressed="false"><i data-lucide="rows-2"></i></button></fieldset>
<a class="icon" id="download-mask" download title="Download predicted mask (class IDs 0/1)" aria-label="Download predicted mask"><i data-lucide="image-down"></i></a>
</div>
<div class="meta"><span id="filename"></span><div class="legend"><span class="swatch sidewalk"></span>Sidewalk <span class="swatch uncertain"></span>Reference unknown / ignored</div></div>
<section class="metrics-strip" aria-label="Per-image pixel metrics">
<dl class="metrics"><div><dt>P <span>Precision</span></dt><dd id="metric-p">N/A</dd></div>
<div><dt>R <span id="recall-label">Recall</span></dt><dd id="metric-r">N/A</dd></div>
<div><dt>F1 <span>Score</span></dt><dd id="metric-f1">N/A</dd></div></dl>
<p id="metric-scope"></p></section>
<div id="message" role="status" aria-live="polite"></div>
<div id="panes" class="panes" data-layout="columns">
<section class="pane" id="pane-original"><div class="pane-heading"><h2>Original</h2><span id="dimensions" class="status"></span></div>
<div class="stage" id="stage-original"><div class="imagebox"><img id="image-original" alt="Original sidewalk camera image"></div></div></section>
<section class="pane selected" id="pane-prediction"><div class="pane-heading"><h2>5.A prediction</h2><span id="coverage" class="status"></span></div>
<div class="stage" id="stage-prediction"><div class="imagebox"><img id="image-prediction" alt="Image underneath model prediction"><canvas id="canvas-prediction" aria-label="Predicted sidewalk mask"></canvas></div></div></section>
<section class="pane" id="pane-reference" hidden><div class="pane-heading"><h2>Reference</h2><span id="reference-kind" class="status"></span></div>
<div class="stage" id="stage-reference"><div class="imagebox"><img id="image-reference" alt="Image underneath saved reference"><canvas id="canvas-reference" aria-label="Saved reference mask"></canvas></div></div></section>
</div>
<div class="review-bar"><strong id="rating">Unreviewed</strong><div class="actions">
<button class="decision" data-decision="correct" title="Correct (1)"><i data-lucide="check"></i>Correct</button>
<button class="decision" data-decision="needs_correction" title="Needs correction (2)"><i data-lucide="flag"></i>Needs correction</button>
<button class="decision" data-decision="uncertain" title="Uncertain (3)"><i data-lucide="circle-help"></i>Uncertain</button>
<button class="icon" data-decision="unreviewed" title="Clear current rating" aria-label="Clear current rating"><i data-lucide="rotate-ccw"></i></button></div></div>
<label class="notes-label">Review notes<textarea id="notes" rows="2"></textarea></label>
<footer><span id="saved">Unreviewed</span><span id="provenance"></span></footer>
</main>
<dialog id="correction-dialog" aria-labelledby="correction-title"><div class="dialog-heading"><h2 id="correction-title">Correction level</h2>
<button class="icon" id="close-correction" title="Cancel (Esc)" aria-label="Cancel"><i data-lucide="x"></i></button></div>
<div class="level-options"><button data-level="1" title="Minor corrections (1)">1 - Minor</button>
<button data-level="2" title="Moderate corrections (2)">2 - Moderate</button><button data-level="3" title="Major corrections (3)">3 - Major</button></div></dialog>
<script src="data.js"></script><script src="lucide.min.js"></script><script src="model_metrics.js"></script><script src="model.js"></script>
</body></html>
