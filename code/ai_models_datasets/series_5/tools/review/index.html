<style>
:root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;color:#21292b;background:#f5f7f7;letter-spacing:0}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 12px;border:1px solid #ccd3d2;border-radius:4px;background:white;color:inherit;cursor:pointer}button:hover{background:#edf4f1}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #57a999;outline-offset:2px}.icon{width:36px;padding:7px}.lucide{width:18px;height:18px;flex:none}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 24px;background:white;border-bottom:1px solid #dce2e0}h1{font-size:20px;line-height:1.3;margin:0}header small{display:block;color:#586564;font-size:12px;margin-top:4px}.actions,.navigation,.modes,.review-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.primary{background:#166a57;color:white;border-color:#166a57}.primary:hover{background:#115342}main{max-width:1680px;margin:auto;padding:20px 24px}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:14px}.modes{gap:0;border:1px solid #ccd3d2;border-radius:4px;background:white;padding:3px}.modes label{padding:6px 10px;cursor:pointer;font-size:13px;border-radius:2px}.modes label:has(input:checked){background:#dcece6;color:#104b3e}.modes input{position:absolute;opacity:0;width:1px}.modes label:focus-within{outline:2px solid #57a999}.opacity{display:flex;align-items:center;gap:8px;font-size:13px}input[type=range]{width:110px;accent-color:#166a57}#position{width:62px;height:34px;padding:6px;border:1px solid #ccd3d2;border-radius:3px}#count{font-size:13px;min-width:50px}#message{min-height:24px;color:#914519;font-size:13px;overflow-wrap:anywhere}#filename{font-family:monospace;font-size:12px;overflow-wrap:anywhere;min-height:28px;margin:0}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px;align-items:start}.image-area{min-width:0;background:#e4e9e6;position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}#empty{position:absolute;color:#4c5b56;font-size:14px}aside{min-width:0;border-left:1px solid #d2dbd5;padding-left:20px}h2{font-size:13px;margin:0 0 12px}.legend{display:grid;gap:8px;font-size:12px}.legend-item{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}.swatch{height:12px;width:12px;border:1px solid #0002}.share{color:#65716d;font-variant-numeric:tabular-nums}.summary{margin-top:18px;padding-top:14px;border-top:1px solid #d2dbd5;font-size:13px;line-height:1.7}.summary strong{font-size:18px}#status{display:inline-block;font-size:12px;padding:5px 0;color:#496056}#flags{font-size:12px;color:#8b451b;overflow-wrap:anywhere;line-height:1.5}.review-strip{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid #d2dbd5}.review-actions button[aria-pressed=true]{background:#dcece6;border-color:#26775f}.review-actions button[data-decision=needs_correction][aria-pressed=true]{background:#ffecd9;border-color:#aa5a19}.notes{display:block;margin-top:16px;font-size:13px}textarea{display:block;width:100%;min-height:78px;resize:vertical;padding:10px;border:1px solid #cbd5d0;border-radius:4px;background:white;margin-top:7px}footer{padding:20px 24px;border-top:1px solid #d2dbd5;color:#66736e;font-size:12px;display:flex;gap:20px;flex-wrap:wrap}#dataset-name{overflow-wrap:anywhere}#review-count{font-variant-numeric:tabular-nums}#load-input,#import-input{display:none}@media(max-width:850px){.workspace{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #d2dbd5;padding:16px 0 0}.legend{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}.summary{margin-top:12px}.toolbar{justify-content:flex-start}main{padding:16px}header{padding:16px}footer{padding:16px}}@media(max-width:430px){.legend{grid-template-columns:1fr 1fr;font-size:11px}.legend-item{grid-template-columns:10px minmax(0,1fr);gap:5px}.share{display:none}.review-actions{gap:6px}.review-actions button{padding:7px 8px;font-size:12px}.opacity input{width:90px}h1{font-size:18px}}
.review-options{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;margin-bottom:14px;font-size:13px}.review-options label{display:flex;align-items:center;gap:7px}.review-options select{max-width:100%;min-height:36px;border:1px solid #ccd3d2;border-radius:4px;background:white;padding:6px}.review-options input{accent-color:#166a57}kbd{font:12px monospace;border:1px solid #ccd3d2;border-radius:3px;padding:1px 5px;min-width:20px;text-align:center;background:#f5f7f7;color:#384742}.legend-item.focus-class{font-weight:bold}.legend-item.muted{opacity:.5}#last-action{min-height:22px;margin-top:10px;font-size:12px;color:#496056;overflow-wrap:anywhere}#review-scope-label{font-size:13px;font-weight:normal}#position{width:72px}@media(max-width:430px){.review-options{gap:10px}.review-options select{max-width:220px}}

<body>
<header><div><h1>SidewalkPilot <span style="font-weight:400">/ Mask Review</span></h1><small>Series 5 · 12-class pilot</small></div><div class="actions"><button class="primary" id="open"><i data-lucide="folder-open"></i>Open folder</button><button class="icon" id="import" title="Import review decisions" aria-label="Import review decisions"><i data-lucide="upload"></i></button><button class="icon" id="export" title="Export review decisions" aria-label="Export review decisions" disabled><i data-lucide="download"></i></button><button id="clear-reviews" title="Clear this dataset's saved reviews, keeping images and masks" disabled><i data-lucide="trash-2"></i>Clear reviews</button></div></header>
<input id="load-input" type="file" webkitdirectory multiple><input id="import-input" type="file" accept="application/json">
<main>
<div class="toolbar"><button id="edit-mode" aria-pressed="false" disabled><i data-lucide="pencil"></i>Edit class 1</button></div>
<div class="editor-tools" id="edit-tools" hidden>
<div class="tool-group" role="group" aria-label="Correction tools">
<button class="icon" data-tool="brush" title="Brush" aria-label="Brush" aria-pressed="true"><i data-lucide="paintbrush"></i></button>
<button class="icon" data-tool="eraser" title="Erase to non-sidewalk" aria-label="Erase to non-sidewalk" aria-pressed="false"><i data-lucide="eraser"></i></button>
<button class="icon" data-tool="polygon" title="Polygon; Enter to fill" aria-label="Polygon" aria-pressed="false"><i data-lucide="pentagon"></i></button>
<button class="icon" data-tool="pan" title="Pan" aria-label="Pan" aria-pressed="false"><i data-lucide="hand"></i></button>
<button class="icon" id="polygon-finish" title="Fill polygon (Enter)" aria-label="Fill polygon" disabled><i data-lucide="check"></i></button>
<button class="icon" id="polygon-cancel" title="Cancel polygon (Escape)" aria-label="Cancel polygon" disabled><i data-lucide="x"></i></button>
</div>
<fieldset><legend>Paint label</legend>
<label title="Sidewalk (1)"><input type="radio" name="paint-label" value="1" checked><span class="paint-swatch paint-sidewalk"></span>Sidewalk</label>
<label title="Non-sidewalk (2)"><input type="radio" name="paint-label" value="0"><span class="paint-swatch paint-negative"></span>Non-sidewalk</label>
<label title="Uncertain (3)"><input type="radio" name="paint-label" value="255"><span class="paint-swatch paint-uncertain"></span>Uncertain</label>
</fieldset>
<label>Brush <input id="brush-size" type="range" min="1" max="160" value="24"><output id="brush-value">24 px</output></label>
<div class="tool-group"><button class="icon" id="edit-undo" title="Undo (Command/Ctrl+Z)" aria-label="Undo" disabled><i data-lucide="undo-2"></i></button><button class="icon" id="edit-redo" title="Redo (Command/Ctrl+Shift+Z)" aria-label="Redo" disabled><i data-lucide="redo-2"></i></button></div>
<div class="tool-group"><button class="icon" id="zoom-out" title="Zoom out" aria-label="Zoom out"><i data-lucide="zoom-out"></i></button><output id="zoom-value">100%</output><button class="icon" id="zoom-in" title="Zoom in" aria-label="Zoom in"><i data-lucide="zoom-in"></i></button><button class="icon" id="zoom-fit" title="Fit image" aria-label="Fit image"><i data-lucide="maximize"></i></button></div>
<label><input id="edit-original" type="checkbox">Original proposal</label>
<label><input id="reference-only" type="checkbox" checked disabled>Audit set <span id="reference-size"></span></label>
</div>
<input id="correction-input" type="file" accept="application/json" hidden>
<div class="toolbar"><div class="navigation"><button class="icon" id="previous" title="Previous image (Left arrow)" aria-label="Previous image" disabled><i data-lucide="chevron-left"></i></button><input id="position" type="number" min="1" value="1" aria-label="Image number" disabled><span id="count">/ 0</span><button class="icon" id="next" title="Next image, without marking it (Enter)" aria-label="Next image" aria-keyshortcuts="Enter ArrowRight" disabled><i data-lucide="chevron-right"></i></button><kbd>Enter</kbd></div><div class="modes" role="group" aria-label="Image view"><label><input type="radio" name="mode" value="source">Source</label><label><input type="radio" name="mode" value="overlay" checked>Overlay</label><label><input type="radio" name="mode" value="mask">Labels</label></div><label class="opacity">Opacity <input id="opacity" type="range" min="0" max="90" value="45"><span id="opacity-value">45%</span></label></div>
<div class="review-options"><label>Review scope <select id="scope"><option value="class-1">Class 1: Sidewalk/path only</option><option value="all">Whole mask: all classes</option></select></label><label><input id="focus-only" type="checkbox" checked>Highlight class 1 only</label><label><input id="auto-advance" type="checkbox" checked>Advance after decision</label></div>
<div id="message" role="status" aria-live="polite"></div><p id="filename">No dataset selected</p>
<div class="workspace"><section><div class="image-area"><canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="Current image and segmentation overlay"></canvas><span id="empty">No image selected</span></div><div class="review-strip"><span id="status">Unreviewed</span><div class="review-actions"><button data-decision="correct" aria-pressed="false" aria-keyshortcuts="1" title="Mark correct for the selected review scope (1)" disabled><i data-lucide="check"></i>Correct <kbd>1</kbd></button><button data-decision="needs_correction" aria-pressed="false" aria-keyshortcuts="2" title="Flag for correction in the selected review scope (2)" disabled><i data-lucide="flag"></i>Needs correction <kbd>2</kbd></button><button data-decision="uncertain" aria-pressed="false" disabled><i data-lucide="circle-help"></i>Uncertain</button><button class="icon" data-decision="unreviewed" title="Clear decision" aria-label="Clear decision" disabled><i data-lucide="rotate-ccw"></i></button></div></div><div id="last-action" role="status" aria-live="polite"></div><label class="notes">Review notes<textarea id="notes" disabled></textarea></label><div id="flags"></div></section><aside><h2>CLASS COVERAGE</h2><div class="legend" id="legend"></div><div class="summary"><strong id="review-count">0 / 0</strong><br><span id="review-scope-label">Class 1 reviewed</span><span id="correct-count" style="display:block">0 marked correct</span></div></aside></div>
</main><footer><span id="dataset-name">Local dataset</span><span>Generated annotations · Human review pending</span></footer>
<script src="lucide.min.js"></script>
<script src="corrections.js"></script>
<script id="review-reset-request" type="application/json">{}</script>
<script>
"use strict";
lucide.createIcons();
const $ = id => document.getElementById(id), canvas = $("canvas"), ctx = canvas.getContext("2d");
let manifest = null, taxonomy = null, files = new Map(), records = new Map();
let names = [], decisions = {}, index = 0, revision = 0, datasetKey = "", key = "", current = null;
let server = false, lastTerminalRevision = -1;
let referenceNames = [];
const panel = document.createElement("div"); panel.id = "editor-panel"; panel.className = "editor-panel"; panel.hidden = true;
panel.innerHTML = '<h2>CLASS 1 REFERENCE</h2><span id="correction-status">No reference selected</span><div id="correction-saved"></div><label><input id="reference-ready" type="checkbox" disabled> Reference checked</label><label>Correction notes<textarea id="correction-notes" disabled></textarea></label><div class="tool-group"><button id="export-corrections" disabled><i data-lucide="download"></i>Export corrections</button><button class="icon" id="import-corrections" title="Import corrections" aria-label="Import corrections" disabled><i data-lucide="upload"></i></button></div><div id="correction-count"></div>';
document.querySelector("aside").append(panel); lucide.createIcons();
const states = {unreviewed:"Unreviewed", correct:"Marked correct", needs_correction:"Needs correction", uncertain:"Uncertain"};
const message = text => { $("message").textContent = text; };
const classOnly = () => $("scope").value === "class-1";
const scopeLabel = () => classOnly() ? "Class 1" : "Whole mask";
const focusImage = () => canvas.focus({preventScroll:true});
const editor = new MaskCorrections({$: $, canvas, message, draw, show, file:getFile, record:getRecord,
  current:()=>current, names:()=>names, index:()=>index, visibleNames});
function visibleNames() { return editor.active && $("reference-only").checked && referenceNames.length ? referenceNames : names; }
function navigationUI() {
  const list = visibleNames(), position = list.indexOf(names[index]);
  $("position").value = position + 1; $("position").max = list.length; $("count").textContent = "/ " + list.length;
  $("previous").disabled = position <= 0; $("next").disabled = position >= list.length - 1;
}
function stepImage(delta) {
  const list = visibleNames(), position = list.indexOf(names[index]);
  return show(names.indexOf(list[Math.max(0, Math.min(list.length-1, position+delta))]));
}
function reviewScope() {
  return classOnly() ? {kind:"class", class_ids:[1], class_names:["Sidewalk/path"]}
    : {kind:"whole_mask", class_ids:taxonomy.classes.map(c => c.id), ignore_id:255};
}
function resetDataset() {
  editor.reset(); referenceNames = [];
  revision++; manifest = null; taxonomy = null; names = []; decisions = {}; current = null;
  key = ""; datasetKey = ""; index = 0;
  $("scope").disabled = false;
  document.querySelector("header small").textContent = "Series 5 · 12-class pilot";
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  $("empty").textContent = "No image selected"; $("empty").hidden = false;
  $("filename").textContent = "No dataset selected"; $("count").textContent = "/ 0"; $("position").value = 1;
  $("legend").replaceChildren(); $("notes").value = ""; $("flags").textContent = "";
  $("status").textContent = "Unreviewed"; $("last-action").textContent = ""; $("dataset-name").textContent = "Local dataset";
  for (const id of ["position","previous","next","notes","export","clear-reviews"]) $(id).disabled = true;
  document.querySelectorAll("[data-decision]").forEach(b => { b.disabled = true; b.setAttribute("aria-pressed", "false"); });
  totals();
}
function safePath(path) {
  if (typeof path !== "string" || path.startsWith("/") || path.split("/").some(p => p === ".." || p === ".")) throw Error("Invalid dataset path");
  return path;
}
async function getFile(path) {
  safePath(path);
  if (server) {
    const response = await fetch("/dataset/" + path.split("/").map(encodeURIComponent).join("/"));
    if (!response.ok) throw Error("Missing file: " + path);
    return await response.blob();
  }
  const file = files.get(path); if (!file) throw Error("Missing file: " + path); return file;
}
async function getJSON(path) { return JSON.parse(await (await getFile(path)).text()); }
async function getRecord(name) {
  if (!records.has(name)) records.set(name, await getJSON("records/" + name.replace(/\.jpg$/i, ".json")));
  return records.get(name);
}
async function getImage(path) {
  const blob = await getFile(path), url = URL.createObjectURL(blob);
  try { const image = new Image(); image.src = url; await image.decode(); return image; }
  finally { URL.revokeObjectURL(url); }
}
function persist() {
  try { localStorage.setItem(key, JSON.stringify(decisions)); return true; }
  catch { message("Browser storage unavailable. Export your review decisions before closing."); return false; }
}
function removeSavedReviews() {
  for (const suffix of ["", ":position", ":class-1", ":class-1:position"]) localStorage.removeItem(datasetKey + suffix);
}
function applyRequestedReset() {
  // A deployment may carry an explicit, one-time user request for this dataset only.
  const request = JSON.parse($("review-reset-request").textContent);
  if (!request.id || request.dataset_key !== datasetKey) return false;
  const marker = datasetKey + ":applied-reset";
  if (localStorage.getItem(marker) === request.id) return false;
  removeSavedReviews();
  localStorage.setItem(marker, request.id);
  return true;
}
function validateDecisions(value) {
  if (!value || typeof value !== "object" || Array.isArray(value)) throw Error("Invalid review decisions");
  for (const [name, entry] of Object.entries(value)) {
    if (!names.includes(name) || !entry || !Object.hasOwn(states, entry.decision) || typeof entry.notes !== "string" || typeof entry.mask_sha256 !== "string") throw Error("Invalid review record");
  }
  return value;
}
function loadDecisions() {
  // Retain the original whole-mask store; class-only decisions never promote those approvals.
  key = datasetKey + (classOnly() ? ":class-1" : ""); decisions = {};
  try { decisions = validateDecisions(JSON.parse(localStorage.getItem(key) || "{}")); } catch {}
  $("last-action").textContent = "";
}
function totals() {
  const values = Object.values(decisions);
  $("review-count").textContent = values.filter(d => d.decision !== "unreviewed").length + " / " + names.length;
  $("correct-count").textContent = values.filter(d => d.decision === "correct").length + " marked correct";
  $("review-scope-label").textContent = scopeLabel() + " reviewed";
}
function decisionUI() {
  const entry = decisions[names[index]], state = entry?.decision || "unreviewed";
  $("status").textContent = states[state]; $("notes").value = entry?.notes || "";
  document.querySelectorAll("[data-decision]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.decision === state)));
  totals();
}
async function setDecision(state) {
  if (!current || editor.active) return;
  decisions[names[index]] = {decision:state, notes:$("notes").value, mask_sha256:current.record.mask_sha256, updated_utc:new Date().toISOString()};
  const saved = persist(); decisionUI();
  $("last-action").textContent = "Image " + (index + 1) + " / " + scopeLabel() + ": " + states[state] + (index === names.length - 1 ? " (last image)" : "");
  if (state !== "unreviewed" && $("auto-advance").checked && index < names.length - 1) await show(index + 1);
  if (!saved) message("Browser storage unavailable. Export your review decisions before closing.");
}
function draw() {
  if (!current) return;
  if (editor.active) { editor.draw(ctx, document.querySelector("input[name=mode]:checked").value); return; }
  const {image, mask, record} = current, [w, h] = record.size;
  canvas.width = w; canvas.height = h; ctx.drawImage(image, 0, 32, w, h, 0, 0, w, h);
  const mode = document.querySelector("input[name=mode]:checked").value;
  if (mode === "source") return;
  const pixels = ctx.getImageData(0, 0, w, h), opacity = Number($("opacity").value) / 100, focus = $("focus-only").checked;
  for (let i = 0; i < w * h; i++) {
    const id = mask[i], offset = i * 4;
    let color = id === 255 ? [225,229,226] : taxonomy.classes[id].color;
    let alpha = mode === "mask" ? 1 : opacity;
    if (focus && id !== 1) { color = [28,33,34]; alpha = mode === "mask" ? 1 : 0; }
    else if (id === 255 && mode !== "mask") alpha = ((i % w + Math.floor(i / w)) % 24 < 2) ? .45 : 0;
    for (let c = 0; c < 3; c++) pixels.data[offset + c] = Math.round(pixels.data[offset + c] * (1 - alpha) + color[c] * alpha);
  }
  ctx.putImageData(pixels, 0, 0);
}
function legendFocus() {
  document.querySelectorAll(".legend-item").forEach(row => {
    row.classList.toggle("focus-class", row.dataset.id === "1");
    row.classList.toggle("muted", $("focus-only").checked && row.dataset.id !== "1");
  });
}
function legend() {
  const root = $("legend"); root.replaceChildren();
  for (const cls of [...taxonomy.classes, {id:255, name:"Ignore / uncertain", color:[225,229,226]}]) {
    const row = document.createElement("div"); row.className = "legend-item"; row.dataset.id = cls.id;
    const swatch = document.createElement("span"); swatch.className = "swatch"; swatch.style.background = `rgb(${cls.color.join(",")})`;
    const text = document.createElement("span"); text.textContent = cls.id + " · " + cls.name;
    const share = document.createElement("span"); share.className = "share"; share.id = "share-" + cls.id;
    row.append(swatch, text, share); root.append(row);
  }
  legendFocus();
}
async function show(nextIndex) {
  if (!names.length || !editor.canLeave()) return;
  editor.leave();
  index = Math.max(0, Math.min(names.length - 1, Math.trunc(Number(nextIndex)) || 0));
  const token = ++revision; current = null;
  try { localStorage.setItem(key + ":position", String(index)); } catch {}
  $("empty").textContent = "Loading"; $("empty").hidden = false;
  navigationUI(); $("filename").textContent = names[index];
  $("notes").disabled = true; document.querySelectorAll("[data-decision]").forEach(b => b.disabled = true);
  decisionUI(); message("");
  try {
    const record = await getRecord(names[index]);
    const [image, png] = await Promise.all([getImage(record.overlay), getImage(record.mask)]);
    if (token !== revision) return;
    const [w, h] = record.size;
    if (png.width !== w || png.height !== h || image.width !== w * 2 || image.height !== h + 32) throw Error("Image and mask dimensions do not match");
    const scratch = document.createElement("canvas"); scratch.width = w; scratch.height = h;
    const context = scratch.getContext("2d"); context.drawImage(png, 0, 0);
    const rgba = context.getImageData(0, 0, w, h).data, mask = new Uint8Array(w * h);
    for (let i = 0; i < mask.length; i++) { mask[i] = rgba[i * 4]; if (mask[i] > 11 && mask[i] !== 255) throw Error("Mask contains invalid IDs"); }
    current = {image, mask, record};
    if (editor.active) await editor.open(current);
    if (token !== revision) return;
    $("edit-mode").disabled = false; $("empty").hidden = true; $("notes").disabled = false;
    document.querySelectorAll("[data-decision]").forEach(b => b.disabled = false);
    for (const cls of [...taxonomy.classes, {id:255}]) $("share-" + cls.id).textContent = ((record.pixel_counts[String(cls.id)] || 0) / (w * h) * 100).toFixed(1) + "%";
    const flags = [...record.qa_flags];
    if (!record.pixel_counts["1"]) flags.unshift("Class 1: no sidewalk/path pixels in this mask");
    if (record.annotation?.abstain) flags.push("Annotation withheld: " + record.annotation.abstain);
    if (record.annotation?.note) flags.push(record.annotation.note);
    $("flags").textContent = flags.join(" · "); draw();
    focusImage();
  } catch (error) {
    if (token !== revision) return;
    current = null; editor.leave();
    $("empty").textContent = "Image unavailable"; message(error.message);
  }
}
async function load() {
  manifest = await getJSON("manifest.json"); taxonomy = await getJSON("taxonomy.json");
  if (taxonomy.classes?.length !== 12 || taxonomy.ignore_id !== 255 || taxonomy.classes.some((c, i) => c.id !== i)) throw Error("Expected the 12-class Series 5 taxonomy");
  names = manifest.images;
  if (!Array.isArray(names) || !names.length || new Set(names).size !== names.length || names.some(n => typeof n !== "string" || n.includes("/") || n.includes("\\") || !n.endsWith(".jpg"))) throw Error("Invalid pilot manifest");
  const partial = manifest.annotation_scope?.kind === "class";
  if (partial && JSON.stringify(manifest.annotation_scope.class_ids) !== "[1]") throw Error("Unsupported partial annotation scope");
  $("scope").disabled = partial;
  if (partial) { $("scope").value = "class-1"; $("focus-only").checked = true; }
  document.querySelector("header small").textContent = partial
    ? "Series 5 · " + (manifest.review_label || "Class 1 diagnostic") + (manifest.contract.config?.annotation_author ? " · AI-assisted prompts" : "")
    : "Series 5 · 12-class pilot";
  datasetKey = "sp-review:" + manifest.created_utc + ":" + manifest.contract.source_names_sha256;
  referenceNames = [];
  if (files.has("correction-selection.json") || server) {
    let selection = null;
    try { selection = await getJSON("correction-selection.json"); } catch (e) { if (files.has("correction-selection.json")) throw e; }
    if (selection) {
      if (selection.schema !== "sidewalkpilot-correction-selection-v1" || selection.dataset_key !== datasetKey || !Array.isArray(selection.images) || !selection.images.length || selection.images.some(n=>!names.includes(n)) || new Set(selection.images).size !== selection.images.length) throw Error("Invalid correction selection");
      referenceNames = selection.images;
    }
  }
  $("reference-only").disabled = !referenceNames.length; $("reference-size").textContent = referenceNames.length ? "("+referenceNames.length+")" : "";
  await editor.configure(datasetKey);
  let reset = false, resetFailed = false;
  try { reset = applyRequestedReset(); } catch { resetFailed = true; }
  loadDecisions();
  $("count").textContent = "/ " + names.length; $("position").max = names.length; $("position").disabled = false; $("export").disabled = false;
  $("clear-reviews").disabled = false;
  $("dataset-name").textContent = taxonomy.version + " · " + names.length + " images";
  let position = 0; try { if (!server) position = Number(localStorage.getItem(key + ":position")) || 0; } catch {}
  legend(); await show(position);
  if (reset) $("last-action").textContent = "Previous reviews cleared. Images and masks unchanged.";
  if (resetFailed) message("Could not reset saved reviews. Use Clear reviews or allow browser storage for this page.");
}
$("clear-reviews").onclick = async () => {
  if (!manifest || !confirm("Clear all saved class-1 and whole-mask reviews, including notes, for this dataset? Images, masks, and exported JSON files will not be changed.")) return;
  let cleared = true;
  try { removeSavedReviews(); } catch { cleared = false; }
  decisions = {}; await show(0);
  $("last-action").textContent = cleared ? "Reviews cleared. Images and masks unchanged." : "Reviews cleared for this session only.";
  if (!cleared) message("Browser storage unavailable; saved reviews could not be removed.");
};
$("open").onclick = () => $("load-input").click();
$("load-input").onchange = async event => {
  if (!event.target.files.length) return;
  if (!editor.canLeave()) return;
  server = false; resetDataset(); files = new Map(); records = new Map();
  for (const file of event.target.files) { const parts = file.webkitRelativePath.split("/"); parts.shift(); files.set(parts.join("/"), file); }
  try { await load(); } catch (error) { resetDataset(); message(error.message); }
};
$("previous").onclick = () => stepImage(-1);
$("next").onclick = () => stepImage(1);
function jumpToPosition() {
  const list = visibleNames();
  const next = names.indexOf(list[Math.max(0, Math.min(list.length - 1, Math.trunc(Number($("position").value) || 1) - 1))]);
  if (next !== index) show(next);
  else navigationUI();
}
$("reference-only").onchange = () => {
  if (!editor.canLeave()) { $("reference-only").checked = !$("reference-only").checked; return; }
  const list = visibleNames(); show(names.indexOf(list.includes(names[index]) ? names[index] : list[0]));
};
$("position").onchange = jumpToPosition;
$("position").onkeydown = event => { if (event.key === "Enter") { event.preventDefault(); jumpToPosition(); focusImage(); } };
$("scope").onchange = () => {
  $("focus-only").checked = classOnly(); legendFocus();
  if (!manifest) { totals(); return; }
  loadDecisions(); show(index);
};
$("focus-only").onchange = () => { legendFocus(); draw(); focusImage(); };
$("opacity").oninput = () => { $("opacity-value").textContent = $("opacity").value + "%"; draw(); };
document.querySelectorAll("input[name=mode]").forEach(input => input.onchange = draw);
canvas.onclick = focusImage;
document.querySelectorAll("[data-decision]").forEach(button => button.onclick = () => setDecision(button.dataset.decision));
$("notes").oninput = () => {
  if (!current) return;
  decisions[names[index]] = {decision:decisions[names[index]]?.decision || "unreviewed", notes:$("notes").value, mask_sha256:current.record.mask_sha256, updated_utc:new Date().toISOString()};
  persist();
};
document.addEventListener("keydown", event => {
  if (editor.keydown(event)) return;
  const target = event.target;
  if (event.defaultPrevented || event.isComposing || event.ctrlKey || event.metaKey || event.altKey) return;
  if (event.key === "Escape") { focusImage(); return; }
  if (target.isContentEditable || target.closest("textarea") || (target.tagName === "INPUT" && !["checkbox","radio","range"].includes(target.type))) return;
  const action = {Digit1:"1", Digit2:"2", Numpad1:"1", Numpad2:"2", NumpadEnter:"Enter"}[event.code] || event.key;
  if (event.shiftKey && action !== "1" && action !== "2") return;
  if (!["Enter","ArrowRight","ArrowLeft","1","2"].includes(action)) return;
  // Preserve native arrow navigation in controls, while 1/2 also work with those controls focused.
  if ((target.tagName === "SELECT" || target.type === "range" || target.type === "radio") && ["ArrowRight","ArrowLeft"].includes(action)) return;
  if (target.tagName === "SELECT" && action === "Enter") return;
  // Prevent native button activation as well as repeat events from approving unseen images.
  event.preventDefault(); if (event.repeat || !current) return;
  focusImage();
  if (action === "1") setDecision("correct");
  else if (action === "2") setDecision("needs_correction");
  else stepImage(action === "ArrowLeft" ? -1 : 1);
}, true);
$("export").onclick = () => {
  const blob = new Blob([JSON.stringify({schema:"sidewalkpilot-mask-review-v2", dataset_key:datasetKey, review_scope:reviewScope(), exported_utc:new Date().toISOString(), decisions}, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob), anchor = document.createElement("a"); anchor.href = url;
  anchor.download = classOnly() ? "sidewalkpilot-class-1-review.json" : "sidewalkpilot-mask-review.json";
  anchor.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
};
$("import").onclick = () => $("import-input").click();
$("import-input").onchange = async event => {
  const file = event.target.files[0]; if (!file) return;
  const importKey = key, importRevision = revision;
  try {
    if (!manifest) throw Error("Select a dataset first");
    const value = JSON.parse(await file.text());
    if (value.dataset_key !== datasetKey) throw Error("Review belongs to a different dataset");
    if (value.schema === "sidewalkpilot-mask-review-v1") {
      if (classOnly()) throw Error("Legacy reviews cover the whole mask. Select Whole mask to import; class 1 reviews are separate.");
    } else if (value.schema !== "sidewalkpilot-mask-review-v2") throw Error("Unknown review format");
    else if (value.review_scope?.kind !== reviewScope().kind || JSON.stringify(value.review_scope.class_ids) !== JSON.stringify(reviewScope().class_ids)) throw Error("Review scope differs. Select the matching review scope before importing.");
    const incoming = validateDecisions(value.decisions);
    for (const [name, entry] of Object.entries(incoming)) {
      const record = await getRecord(name);
      if (record.mask_sha256 !== entry.mask_sha256) throw Error("Review mask hash does not match");
    }
    if (key !== importKey || revision !== importRevision) throw Error("View changed during import. Please import again.");
    decisions = incoming; const saved = persist(); decisionUI();
    if (saved) message("Review imported");
  } catch (error) { message(error.message); }
  finally { event.target.value = ""; }
};
if (location.search === "?terminal=1") {
  server = true; load().catch(error => message(error.message));
  setInterval(async () => {
    if (!server) return;
    try {
      const response = await fetch("/position"); if (!response.ok) return;
      const state = await response.json();
      if (state.revision !== lastTerminalRevision && names.length && !editor.active) { lastTerminalRevision = state.revision; await show(state.index); }
    } catch {}
  }, 500);
}
</script>
</body>
