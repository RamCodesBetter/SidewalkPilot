<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Labeling history | SidewalkPilot</title>
<style>
:root{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20262b;background:#fff;letter-spacing:0;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}body{margin:0}main,header>div{max-width:1100px;margin:auto;padding:0 24px}
header{background:#212a29;color:#fff}header>div,.heading,.section-head,.progress-label{display:flex;align-items:center;justify-content:space-between;gap:12px}
header>div{height:48px}header strong{font-size:17px}header span{color:#c0cdc9;font-size:13px}
.heading{padding:24px 0 16px}h1,h2,p{margin:0}h1{font-size:26px}h2{font-size:18px}
#state{color:#075944;background:#e3f2ed;padding:4px 9px;border-radius:4px;font-weight:650;font-size:13px}
.numbers{display:grid;grid-template-columns:2fr repeat(3,1fr);border-block:1px solid #cdd6d2;padding:18px 0;gap:16px}
.numbers div{border-left:1px solid #dce2de;padding-left:20px}.numbers div:first-child{border:0;padding:0}
.label,.progress-label,footer{color:#535f62;font-size:13px}.numbers b{display:block;font-size:24px;line-height:1.35}
.numbers small{font-size:15px;font-weight:500;color:#53615f}.pass{color:#096449}.defer{color:#8c5419}
.progress-label{margin:12px 0 5px}progress{width:100%;height:6px;display:block;appearance:none;background:#e7ecea;border:0;border-radius:3px;overflow:hidden}
progress::-webkit-progress-bar{background:#e7ecea}progress::-webkit-progress-value{background:#148363}progress::-moz-progress-bar{background:#148363}
.section-head{padding:20px 0 10px}.actions{display:flex;gap:7px;align-items:center}
select,button{font:inherit;font-size:13px;color:inherit;background:#fff;border:1px solid #b8c3c0;border-radius:4px;height:34px;cursor:pointer}
select{padding:0 6px}button{width:36px;font-size:21px}button:hover,select:hover{background:#edf3f1}
:focus-visible{outline:2px solid #186a99;outline-offset:2px}
.scroll{overflow:auto;max-height:60vh;max-height:60dvh;border-block:1px solid #c8d1ce;scrollbar-gutter:stable}
table{width:100%;min-width:560px;border-spacing:0;font-size:14px;text-align:right}
th,td{padding:9px 12px;white-space:nowrap}thead th{position:sticky;z-index:1;top:0;background:#eaf0ee;color:#344944;font-size:12px;font-weight:650;border-bottom:1px solid #b6c6bf}
td{border-bottom:1px solid #e3e7e5}th:first-child,td:first-child{text-align:left}tbody tr:nth-child(even){background:#f8faf9}
tbody tr:hover{background:#eff4f9}.latest td:first-child{box-shadow:inset 3px 0 #188360;font-weight:700}
footer{display:flex;gap:10px;justify-content:space-between;padding:10px 0}a{color:#12658a}
@media(max-width:600px){main,header>div{padding-inline:12px}.heading{padding-block:16px 12px}h1{font-size:22px}
.numbers{grid-template-columns:1fr 1fr;gap:12px;padding-block:12px}.numbers div:nth-child(odd){border:0;padding:0}
.numbers b{font-size:20px}.section-head{padding-top:14px}.scroll{max-height:55dvh}th,td{padding:8px}.actions{gap:4px}}
</style>
<header><div><strong>SidewalkPilot</strong><span>Series 5 / SAM 3</span></div></header>
<main>
<div class="heading"><h1>Labeling history</h1><span id="state"></span></div>
<section class="numbers" aria-label="Campaign totals">
<div><span class="label">Passed automatic checks</span><b class="pass"><span id="passed"></span> <small>/ 10,000</small></b></div>
<div><span class="label">Attempted</span><b id="attempted"></b></div>
<div><span class="label">Deferred</span><b id="deferred" class="defer"></b></div>
<div><span class="label">Still needed</span><b id="remaining"></b></div>
</section>
<div class="progress-label"><span>Target progress</span><strong id="pct"></strong></div>
<progress id="bar" max="10000" value="0" aria-label="Target progress"></progress>
<div class="section-head"><h2>Loop history</h2><div class="actions">
<select id="order" aria-label="Loop order"><option value="desc">Newest first</option><option value="asc">Oldest first</option></select>
<button id="refresh" aria-label="Refresh history" title="Refresh history">&#8635;</button></div></div>
<div class="scroll" tabindex="0" role="region" aria-label="All completed loops"><table>
<thead><tr><th>Loop</th><th>Attempted</th><th>Passed</th><th>Deferred</th><th>Total passed</th><th>Still needed</th></tr></thead>
<tbody id="rows"></tbody></table></div>
<footer><span id="stamp"></span><a href="STATUS.txt">Plain text</a></footer>
</main>
<script type="application/json" id="snapshot">null</script>
<script>
const $=id=>document.getElementById(id), fmt=n=>n.toLocaleString();
const report=JSON.parse($('snapshot').textContent);
function draw(){
  const rows=$('order').value==='asc'?report.rows:[...report.rows].reverse();
  $('rows').replaceChildren(...rows.map(values=>{
    const tr=document.createElement('tr'); if(values[0]===report.rows.length)tr.className='latest';
    values.forEach((n,i)=>{const td=tr.insertCell();td.textContent=fmt(n);if(i===2)td.className='pass';if(i===3)td.className='defer';});
    return tr;
  }));
}
if(report){
  for(const k of ['passed','attempted','deferred','remaining']) $(k).textContent=fmt(report[k]);
  $('state').textContent=report.state.replaceAll('_',' ');
  $('bar').value=report.passed;$('pct').textContent=(100*report.passed/10000).toFixed(1)+'%';
  $('stamp').textContent=report.rows.length+' loops | Updated '+new Date(report.updated_utc).toLocaleTimeString();
  const scroll=document.querySelector('.scroll'), saved=history.state;
  try{$('order').value=sessionStorage.getItem('history-order')==='asc'?'asc':'desc'}catch{}
  if(saved?.order)$('order').value=saved.order;
  $('order').onchange=()=>{try{sessionStorage.setItem('history-order',$('order').value)}catch{}draw();document.querySelector('.scroll').scrollTop=0};draw();
  // In newest-first order, extra rows appear above the reader between snapshots.
  const rowHeight=()=>$('rows').firstElementChild?.getBoundingClientRect().height||0;
  if(saved){
    const added=saved.order==='desc'&&saved.top>0?Math.max(0,report.rows.length-saved.count):0;
    scroll.scrollTo(saved.left,saved.top+added*rowHeight());
  }
  function reload(){
    history.replaceState({order:$('order').value,top:scroll.scrollTop,left:scroll.scrollLeft,count:report.rows.length},'');
    location.reload();
  }
  $('refresh').onclick=reload;
  if(report.state==='running'){
    $('stamp').append(' | Auto-refresh: 15s');
    setInterval(()=>{if(!document.hidden)reload()},15000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reload()});
  }
}else{$('state').textContent='No snapshot'}
if(!report)$('refresh').onclick=()=>location.reload();
</script>
</html>
